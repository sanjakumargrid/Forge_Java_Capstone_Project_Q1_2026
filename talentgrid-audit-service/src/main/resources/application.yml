server:
  port: ${AUDIT_SERVICE_PORT:8084}

spring:
  config:
    # Single source of truth: repo-root .env (../ or ../../ from module working directory)
    import: optional:file:../.env[.properties],optional:file:../../.env[.properties]

  application:
    name: talentgrid-audit-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_HOST_PORT:5432}/${DB_NAME:talentgrid}}
    username: ${DB_USERNAME:talentgrid}
    password: ${DB_PASSWORD:talentgrid}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: audit-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring:
          json:
            trusted:
              packages: "*"
            value:
              default:
                type: com.talentgrid.kafka.events.base.BaseEvent

logging:
  level:
    root: INFO
    com.talentgrid.auditservice: DEBUG
    org.springframework.kafka: INFO