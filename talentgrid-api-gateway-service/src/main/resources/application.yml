server:
  port: ${API_GATEWAY_PORT:8080}
  shutdown: graceful

talentgrid:
  gateway:
    # Set GATEWAY_REQUEST_LOGGING_ENABLED=true for per-request INFO logs (avoid in production).
    request-logging-enabled: ${GATEWAY_REQUEST_LOGGING_ENABLED:false}

spring:
  config:
    import: "optional:file:../../.env[.properties],classpath:rbac-rules.yml,optional:configserver:"
  application:
    name: talentgrid-api-gateway-service
  lifecycle:
    timeout-per-shutdown-phase: ${GATEWAY_SHUTDOWN_TIMEOUT:30s}
  http:
    codecs:
      # Aligns with RequestSizeValidationFilter for known Content-Length; also caps buffered bodies.
      max-in-memory-size: ${GATEWAY_MAX_IN_MEMORY:10MB}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_HTTP_CONNECT_TIMEOUT:5000}
            response-timeout: ${GATEWAY_HTTP_RESPONSE_TIMEOUT:60s}
          globalcors:
            # Avoid duplicate Access-Control-Allow-Origin (handler mapping + route CORS).
            add-to-simple-url-handler-mapping: false
            cors-configurations:
              "[/**]":
                # Wildcard (*) with allow-credentials causes duplicate/conflicting headers in browsers.
                # Set CORS_ALLOWED_ORIGIN_PATTERNS=http://localhost:4200 in .env for local Angular dev.
                allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200}
                allowed-methods: "*"
                allowed-headers: "*"
                exposed-headers: "*"
                allow-credentials: true
                max-age: 3600
          # Defaults for Redis token bucket (SCG 4.3+); per-route overrides still come from default-filters below.
          redis-rate-limiter:
            replenish-rate: ${RATE_LIMIT_REPLENISH:30}
            burst-capacity: ${RATE_LIMIT_BURST:60}
            requested-tokens: ${RATE_LIMIT_TOKENS:1}
            include-headers: true
          default-filters:
            # Drop duplicate CORS headers if a downstream service still emits them.
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods, RETAIN_FIRST
            - name: SecureHeaders
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${ratelimit.default.replenishRate}
                redis-rate-limiter.burstCapacity: ${ratelimit.default.burstCapacity}
                redis-rate-limiter.requestedTokens: ${ratelimit.default.requestedTokens}
                key-resolver: "#{@userKeyResolver}"


          routes:
            - id: user-auth-service
              uri: http://${USER_AUTH_SERVICE_HOST:localhost}:${USER_AUTH_SERVICE_PORT:8081}
              predicates:
                - "Path=/api/v1/auth/**, /talentgrid/auth/**"
              filters:
                - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
            - id: user-auth-service-frontend-rewrite
              uri: http://${USER_AUTH_SERVICE_HOST:localhost}:${USER_AUTH_SERVICE_PORT:8081}
              predicates:
                - "Path=/talentgrid/login, /talentgrid/register, /talentgrid/logout, /talentgrid/refresh"
              filters:
                - "RewritePath=/talentgrid/(?<segment>.*), /api/v1/auth/${segment}"
            - id: user-auth-admin
              uri: http://${USER_AUTH_SERVICE_HOST:localhost}:${USER_AUTH_SERVICE_PORT:8081}
              predicates:
                - "Path=/api/v1/admin/**, /talentgrid/admin/**"
              filters:
                - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
            - id: user-auth-users
              uri: http://${USER_AUTH_SERVICE_HOST:localhost}:${USER_AUTH_SERVICE_PORT:8081}
              predicates:
                - "Path=/api/v1/users/**, /talentgrid/users/**"
              filters:
                - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
            - id: user-auth-projects
              uri: http://${USER_AUTH_SERVICE_HOST:localhost}:${USER_AUTH_SERVICE_PORT:8081}
              predicates:
                - "Path=/api/v1/projects/**, /talentgrid/projects/**"
              filters:
                - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
            - id: user-auth-accounts
              uri: http://${USER_AUTH_SERVICE_HOST:localhost}:${USER_AUTH_SERVICE_PORT:8081}
              predicates:
                - "Path=/api/v1/accounts/**, /talentgrid/accounts/**"
              filters:
                - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
            - id: user-auth-lookup
              uri: http://${USER_AUTH_SERVICE_HOST:localhost}:${USER_AUTH_SERVICE_PORT:8081}
              predicates:
                - "Path=/api/v1/lookup/**, /talentgrid/lookup/**"
              filters:
                - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
            - id: user-auth-assignments
              uri: http://${USER_AUTH_SERVICE_HOST:localhost}:${USER_AUTH_SERVICE_PORT:8081}
              predicates:
                - "Path=/api/v1/assignments/**, /talentgrid/assignments/**"
              filters:
                - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
            - id: demand-analytics
