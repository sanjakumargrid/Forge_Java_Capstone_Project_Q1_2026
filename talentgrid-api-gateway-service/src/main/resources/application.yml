ratelimit:
  default:
    replenishRate: ${RATE_LIMIT_REPLENISH:30}
    burstCapacity: ${RATE_LIMIT_BURST:60}
    requestedTokens: ${RATE_LIMIT_TOKENS:1}
management:
  otlp:
    tracing:
      # Used only when export is enabled (see export.enabled below).
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        # Avoid ERROR spam when no OTLP collector is listening on :4318 (local dev).
        # Set OTEL_TRACING_EXPORT_ENABLED=true when an OpenTelemetry collector is available.
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  issuer: auth-service
logging:
  level:
    com:
      talentgrid:
        gateway: DEBUG
    org:
      springframework:
        cloud:
          gateway: INFO