  config:
    import: "classpath:rbac-rules.yml,optional:configserver:"
ratelimit:
  default:
    replenishRate: ${RATE_LIMIT_REPLENISH:30}
    burstCapacity: ${RATE_LIMIT_BURST:60}
    requestedTokens: ${RATE_LIMIT_TOKENS:1}
management:
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
jwt:
  secret: ${JWT_SECRET}
  issuer: talentgrid-auth-service
logging:
  level:
    com:
      talentgrid:
        gateway: DEBUG
    org:
      springframework:
        cloud:
          gateway: INFO