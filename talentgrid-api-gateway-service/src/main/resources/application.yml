server:
  port: ${PORT:8080}
spring:
  application:
    name: talentgrid-api-gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowed-headers: "*"
            exposed-headers: X-RateLimit-Remaining,X-RateLimit-Limit,X-Trace-Id,X-Correlation-Id
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${ratelimit.default.replenishRate}
            redis-rate-limiter.burstCapacity: ${ratelimit.default.burstCapacity}
            redis-rate-limiter.requestedTokens: ${ratelimit.default.requestedTokens}


      routes:
        - id: user-auth-service
          uri: http://${USER_AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - "Path=/api/v1/auth/**, /talentgrid/auth/**"
          filters:
            - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
        - id: user-auth-service-frontend-rewrite
          uri: http://${USER_AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - "Path=/talentgrid/login, /talentgrid/register, /talentgrid/logout, /talentgrid/refresh"
          filters:
            - "RewritePath=/talentgrid/(?<segment>.*), /api/v1/auth/${segment}"
        - id: user-auth-admin
          uri: http://${USER_AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - "Path=/api/v1/admin/**, /talentgrid/admin/**"
          filters:
            - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
        - id: demand-analytics
          uri: http://${DEMAND_SERVICE_HOST:localhost}:8082
          predicates:
            - "Path=/api/v1/analytics/demands, /talentgrid/analytics/demands"
          filters:
            - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
        - id: demand-scorecards-to-interview
          uri: http://${INTERVIEW_SERVICE_HOST:localhost}:8087
          predicates:
            - "Path=/api/v1/demands/*/scorecards, /talentgrid/demands/*/scorecards"
          filters:
            - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
        - id: demand-service
          uri: http://${DEMAND_SERVICE_HOST:localhost}:8082
          predicates:
            - "Path=/api/v1/demands/**, /talentgrid/demands/**"
          filters:
            - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
        - id: notification-service
          uri: http://${NOTIFICATION_SERVICE_HOST:localhost}:8083
          predicates:
            - "Path=/api/v1/notifications/**, /talentgrid/notifications/**"
          filters:
            - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
        - id: audit-service
          uri: http://${AUDIT_SERVICE_HOST:localhost}:8084
          predicates:
            - "Path=/api/v1/audit/**, /talentgrid/audit/**"
          filters:
            - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
        - id: ai-candidates
          uri: http://${CANDIDATE_SERVICE_HOST:localhost}:8085
          predicates:
            - "Path=/api/v1/ai/candidates/**, /talentgrid/ai/candidates/**"
          filters:
            - "RewritePath=/(api/v1|talentgrid)/(?<segment>.*), /api/v1/${segment}"
        - id: candidate-service
