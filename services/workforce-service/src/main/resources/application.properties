# Single source of truth: repo-root .env (../ or ../../ from module working directory)
spring.config.import=optional:file:../.env[.properties],optional:file:../../.env[.properties]

# Server configuration
server.port=${WORKFORCE_SERVICE_PORT:8091}
spring.application.name=workforce-service

# Active profile: 'dev' uses Ollama (local), 'prod' uses OpenAI
# Override in production with: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# HRIS CSV import (multipart upload)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
hris.import.max-rows=1000
hris.import.process-batch-size=100

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_HOST_PORT:5432}/${DB_NAME:talentgrid}}
spring.datasource.username=${DB_USERNAME:talentgrid}
spring.datasource.password=${DB_PASSWORD:talentgrid}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Kafka configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:workforce-service-group}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.talentgrid.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.talentgrid.kafka.events.base.BaseEvent
spring.kafka.consumer.auto-offset-reset=earliest

# Skill Gap Heatmap configuration
# Number of days of snapshots to retain - older rows are purged on each refresh
skill-gap.retention-days=${SKILL_GAP_RETENTION_DAYS:30}
skill-gap.refresh-debounce-seconds:${SKILL_GAP_REFRESH_DEBOUNCE_SECONDS:30}
# Page size used when paginating through demand-service to collect open demands.
# Raise this to reduce round-trips; lower it if demand-service imposes a max-size cap.
skill-gap.fetch-page-size=${SKILL_GAP_FETCH_PAGE_SIZE:100}

# Other services
demand-service.url=${DEMAND_SERVICE_URL:http://${DEMAND_SERVICE_HOST:localhost}:${DEMAND_SERVICE_PORT:8082}}
user-auth-service.url=${USER_AUTH_SERVICE_URL:http://${USER_AUTH_SERVICE_HOST:localhost}:${USER_AUTH_SERVICE_PORT:8081}}

# Enable Apache HttpClient 5 for OpenFeign to support PATCH requests
spring.cloud.openfeign.httpclient.hc5.enabled=true
spring.cloud.openfeign.httpclient.enabled=true

# Must match JWT_SECRET in repo-root .env
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
