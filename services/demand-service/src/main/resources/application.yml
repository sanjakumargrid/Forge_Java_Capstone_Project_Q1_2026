server:
  port: 8081

spring:
  application:
    name: demand-service
  datasource:
    url: jdbc:postgresql://localhost:5432/demand_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
