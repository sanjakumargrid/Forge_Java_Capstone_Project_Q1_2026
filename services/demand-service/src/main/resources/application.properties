# ─────────────────────────────────────────────────────────────────────────────
# TalentGrid — demand-service configuration
# ─────────────────────────────────────────────────────────────────────────────

# Load repo-root .env (same pattern as user-auth-service) so JWT_SECRET, DB_*, etc. apply when running from IDE.
spring.config.import=optional:file:../../.env

spring.application.name=demand-service
talentgrid.kafka.auth-consumer.enabled=true
server.port=8082

# Kafka — override KAFKA_BOOTSTRAP_SERVERS in Docker/K8s
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer
spring.kafka.consumer.group-id=demand-service-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.talentgrid.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.talentgrid.kafka.events.base.BaseEvent

# Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/talentgrid}
spring.datasource.username=${DB_USERNAME:talentgrid}
spring.datasource.password=${DB_PASSWORD:talentgrid}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.talentgrid.demand=DEBUG
logging.level.org.springframework.kafka=INFO

jwt.secret=${JWT_SECRET:ForgeAINativeWorkforceIntelligencePlatform}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
#spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}

# Gemini AI Configuration
gemini.api.base-url=https://generativelanguage.googleapis.com
gemini.api.key=${GEMINI_API_KEY:}
gemini.embedding.model=models/gemini-embedding-001
gemini.embedding.output-dimension=768
gemini.chat.model=models/gemini-2.5-flash

# Caching TTLs
ai.embedding.skill-cache-ttl-seconds=2592000
ai.embedding.jd-cache-ttl-seconds=86400
