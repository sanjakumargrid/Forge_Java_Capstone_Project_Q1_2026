# Single source of truth: repo-root .env (../ or ../../ from module working directory)
spring.config.import=optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.application.name=Auth
server.port=${USER_AUTH_SERVICE_PORT:8081}

# ==========================================
# DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_HOST_PORT:5432}/${DB_NAME:talentgrid}}
spring.datasource.username=${DB_USERNAME:talentgrid}
spring.datasource.password=${DB_PASSWORD:talentgrid}

# ==========================================
# JPA CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT CONFIGURATION
# ==========================================

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
#jwt.expiration=900000
jwt.expiration=${JWT_EXPIRATION:604800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.issuer=${JWT_ISSUER:auth-service}

# ==========================================
# GOOGLE OAUTH2
# ==========================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}

spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.google.redirect-uri=http://${USER_AUTH_SERVICE_HOST:localhost}:${USER_AUTH_SERVICE_PORT:8081}/login/oauth2/code/google

# Frontend OAuth redirect targets (browser flow)
app.oauth.frontend-base-url=${OAUTH_FRONTEND_BASE_URL:http://localhost:4200}
app.oauth.allowed-email-domain=${OAUTH_ALLOWED_EMAIL_DOMAIN:@griddynamics.com}
app.oauth.callback-path=/auth/callback
app.oauth.login-error-path=/login
app.oauth.exchange-code-ttl-seconds=60

# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.security=DEBUG

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ==========================================
# KAFKA CONFIGURATION
# ==========================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false