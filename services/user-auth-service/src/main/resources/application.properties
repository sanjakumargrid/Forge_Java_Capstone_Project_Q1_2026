# This tells Spring to load the .env file
#spring.config.import=optional:file:.env

spring.application.name=Auth
server.port=8080

# ==========================================
# DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/talentgrid
spring.datasource.username=talentgrid
spring.datasource.password=

# ==========================================
# JPA CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT CONFIGURATION
# ==========================================

jwt.secret=${JWT_SECRET:this-is-a-very-secure-secret-key-that-is-at-least-32-chars}

jwt.expiration=3600000
jwt.refresh-expiration=604800000
jwt.issuer=auth-service

# ==========================================
# GOOGLE OAUTH2
# ==========================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

logging.level.org.springframework.security.oauth2=TRACE

spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.security=DEBUG

spring.data.redis.host=localhost
spring.data.redis.port=6379

