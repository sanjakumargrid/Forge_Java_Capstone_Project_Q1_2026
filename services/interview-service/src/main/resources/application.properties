# ─────────────────────────────────────────────────────────────────────────────
# TalentGrid — interview-service configuration
# ─────────────────────────────────────────────────────────────────────────────

# Single source of truth: repo-root .env (../ or ../../ from module working directory)
spring.config.import=optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.application.name=interview-service
server.port=${INTERVIEW_SERVICE_PORT:8087}

# Temporarily disable Kafka AutoConfiguration so it doesn't hang locally

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.consumer.group-id=interview-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.talentgrid.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.talentgrid.kafka.events.base.BaseEvent

# Other services
application.service.url=${APPLICATION_SERVICE_URL:http://${APPLICATION_SERVICE_HOST:localhost}:${APPLICATION_SERVICE_PORT:8086}}
user-auth-service.url=${USER_AUTH_SERVICE_URL:http://${USER_AUTH_SERVICE_HOST:localhost}:${USER_AUTH_SERVICE_PORT:8081}}
candidate.service.url=${CANDIDATE_SERVICE_URL:http://${CANDIDATE_SERVICE_HOST:localhost}:${CANDIDATE_SERVICE_PORT:8085}}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_HOST_PORT:5432}/${DB_NAME:talentgrid}}
spring.datasource.username=${DB_USERNAME:talentgrid}
spring.datasource.password=${DB_PASSWORD:talentgrid}
spring.datasource.driver-class-name=org.postgresql.Driver

# Must match JWT_SECRET in repo-root .env
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:true}
google.calendar.auth-mode=${GOOGLE_CALENDAR_AUTH_MODE:oauth}
google.calendar.application-name=${GOOGLE_CALENDAR_APP_NAME:TalentGrid}
google.calendar.invites-enabled=${GOOGLE_CALENDAR_INVITES_ENABLED:false}
google.calendar.meet-enabled=${GOOGLE_CALENDAR_MEET_ENABLED:true}

google.oauth.client-secret-path=${GOOGLE_OAUTH_CLIENT_SECRET_PATH:classpath:google/oauth-client-secret.json}
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://${INTERVIEW_SERVICE_HOST:localhost}:${INTERVIEW_SERVICE_PORT:8087}/api/v1/google/oauth/callback}
google.oauth.token-store-dir=${GOOGLE_OAUTH_TOKEN_STORE_DIR:google-oauth-tokens}


# Flyway (Disabled locally since db/migration folder doesn't exist)
spring.flyway.enabled=false

# Google Calendar

google.calendar.service-account-key-path=${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:src/main/resources/google/service-account.json}
google.calendar.delegate-email=${GOOGLE_CALENDAR_DELEGATE_EMAIL:}


# Gemini AI
gemini.enabled=${GEMINI_ENABLED:true}
gemini.api.key=${GEMINI_API_KEY:}

# Compatibility fixes
spring.cloud.compatibility-verifier.enabled=false
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Swagger disabled
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
talentgrid.kafka.auth-consumer.enabled=true


# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
#spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}