# ─────────────────────────────────────────────────────────────────────────────
# TalentGrid — offer-service configuration
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=offer-service
server.port=8085

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

spring.kafka.consumer.group-id=offer-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.talentgrid.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.talentgrid.kafka.events.base.BaseEvent

# Other services
application.service.url=${APPLICATION_SERVICE_URL:http://localhost:8083}
candidate.service.url=${CANDIDATE_SERVICE_URL:http://localhost:8082}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talentgrid}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:talentgrid}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:talentgrid}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

# Compatibility fixes
spring.cloud.compatibility-verifier.enabled=${SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED:false}
spring.mvc.pathmatch.matching-strategy=${SPRING_MVC_PATHMATCH_MATCHING_STRATEGY:ant_path_matcher}

# Swagger disabled
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}

# OpenAI - only needed if this service uses OpenAI
openai.api-key=${OPENAI_API_KEY:}

# =========================
# DocuSign Configuration
# =========================

docusign.integration-key=
docusign.user-id=
docusign.account-id=
docusign.base-path=https://demo.docusign.net/restapi
docusign.private-key-path=docusign/private.key
docusign.auth-server=account-d.docusign.com
docusign.enabled=true