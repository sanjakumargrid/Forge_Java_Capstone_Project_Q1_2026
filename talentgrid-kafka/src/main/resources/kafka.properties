# ─────────────────────────────────────────────────────────────────────────────
# TalentGrid Kafka Shared Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Copy this file into your service's src/main/resources/application.properties
# and override the values specific to your service (group-id, trusted.packages).
# The bootstrap-servers value should be injected via environment variable in
# all non-local environments.
# ─────────────────────────────────────────────────────────────────────────────
#############################################################
# TEMPLATE FILE ONLY
#
# This file is NOT automatically loaded by Spring Boot.
#
# Copy the required properties into:
#   application.properties
# OR
#   application.yml
#
# Alternatively import this file using:
# spring.config.import=classpath:kafka.properties
#
#############################################################
# Broker address — override via SPRING_KAFKA_BOOTSTRAP_SERVERS env var in Docker/K8s
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ─────────────────────────────────────────────────────────────────────────────
# Producer
# ─────────────────────────────────────────────────────────────────────────────
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Omit __TypeId__ header — consumers use value-default-type instead, which is safer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ─────────────────────────────────────────────────────────────────────────────
# Consumer
# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT: Override spring.kafka.consumer.group-id in each service!
# Convention: <service-name>-group  (e.g. demand-service-group, notification-group)
spring.kafka.consumer.group-id=talentgrid-default-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# Trust BaseEvent and all payload classes in talentgrid packages
spring.kafka.consumer.properties.spring.json.trusted.packages=com.talentgrid.*
# Default deserialization target — override per-listener using @KafkaListener's containerFactory
spring.kafka.consumer.properties.spring.json.value.default.type=com.talentgrid.shared.event.BaseEvent
