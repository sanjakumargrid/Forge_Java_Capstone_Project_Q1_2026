# ─────────────────────────────────────────────────────────────────────────────
# TalentGrid Local Infrastructure — Kafka (KRaft mode) + Kafka UI
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d
#   Kafka broker : localhost:9092
#   Kafka UI     : http://localhost:7777
# ─────────────────────────────────────────────────────────────────────────────

services:
  broker:
    image: confluentinc/cp-kafka:7.6.0
    container_name: talentgrid-kafka-broker
    networks:
      - talentgrid-kafka-net
    ports:
      - "9092:9092"
    volumes:
      - ./kafka_data:/var/lib/kafka/data
    environment:
      CLUSTER_ID: "FZ5fgxe8QsiYlf7uOpvVWA"
      KAFKA_NODE_ID: 1
      # KRaft mode — no ZooKeeper required
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:9094"

      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker:9093,EXTERNAL://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      # FIX #9: Original used 'kafka-broker-api-versions' (no .sh suffix).
      # In the cp-kafka container the binary is kafka-broker-api-versions (no .sh)
      # BUT the PATH may not include it directly when run via CMD form.
      # Using the full path + shell form is more reliable:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: talentgrid-kafka-ui
    networks:
      - talentgrid-kafka-net
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "7777:8080"
    restart: always
    environment:
      - KAFKA_CLUSTERS_0_NAME=talentgrid-local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=broker:9093

networks:
  talentgrid-kafka-net:
    driver: bridge