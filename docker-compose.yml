# ─────────────────────────────────────────────────────────────────────────────
# TalentGrid Local Infrastructure
# Kafka (KRaft) + Kafka UI + PostgreSQL + Redis
# ─────────────────────────────────────────────────────────────────────────────
#
# Start:
#   docker compose up -d
#
# Stop:
#   docker compose down
#
# Kafka Broker:
#   localhost:9092
#
# Kafka UI:
#   http://localhost:7777
#
# PostgreSQL (host port = POSTGRES_HOST_PORT, default 5432):
#   localhost:${POSTGRES_HOST_PORT:-5432}
# If you see "Bind for 0.0.0.0:5432 failed: port is already allocated", add to a
# repo-root .env file:  POSTGRES_HOST_PORT=5432
# Then point Spring at: jdbc:postgresql://localhost:5432/talentgrid
#
# DB Name:
#   talentgrid
#
# Username:
#   talentgrid
#
# Password:
#   talentgrid
#
# Redis:
#   localhost:6379
#   Used by user-auth-service (token blacklist, auth cache) and API gateway (rate limiting)
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  broker:
    image: confluentinc/cp-kafka:7.6.0
    container_name: talentgrid-kafka-broker
    networks:
      - talentgrid-network
    ports:
      - "9092:9092"
    volumes:
      - ./kafka_data:/var/lib/kafka/data
    environment:
      CLUSTER_ID: "FZ5fgxe8QsiYlf7uOpvVWA"
      KAFKA_NODE_ID: 1

      # KRaft Mode (No ZooKeeper)
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:9094"

      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker:9093,EXTERNAL://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: talentgrid-kafka-ui
    networks:
      - talentgrid-network
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "7777:8080"
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: talentgrid-local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9093

  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentgrid-postgres
    networks:
      - talentgrid-network
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: talentgrid
      POSTGRES_USER: talentgrid
      POSTGRES_PASSWORD: talentgrid
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U talentgrid" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talentgrid-redis
    networks:
      - talentgrid-network
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  talentgrid-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: