# ─────────────────────────────────────────────────────────────────────────────
# TalentGrid — notification-service configuration
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=notification-service
server.port=8085

# ─────────────────────────────────────────────────────────────────────────────
# Kafka
# ─────────────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer (for future use — e.g. publishing delivery receipts)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer — PLAT-05 consumer group convention: <service-name>-group
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.talentgrid.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.talentgrid.kafka.events.base.BaseEvent

# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL
# FIX: spring.jpa.defer-datasource-initialization=true and
#      spring.sql.init.continue-on-error=true prevent the service from
#      crashing at startup when PostgreSQL is unavailable.
#      Without this, a DB connection failure kills the entire JVM process,
#      which means the Kafka consumer never starts and NO emails are ever sent.
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/talentgrid}
spring.datasource.username=${DB_USERNAME:talentgrid}
spring.datasource.password=${DB_PASSWORD:talentgrid}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# FIX: Do not fail the entire application startup if the DB schema or
# table creation fails. The Kafka consumer (and email delivery) must
# remain functional even when the DB is unavailable.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true

# ─────────────────────────────────────────────────────────────────────────────
# Email (Spring Mail — Gmail SMTP)
# ─────────────────────────────────────────────────────────────────────────────
# Set notification.email.enabled=false to disable email channel in local/test environments
notification.email.enabled=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
# IMPORTANT: Use a Gmail App Password, NOT your regular Gmail password.
# Generate at: https://myaccount.google.com/apppasswords (requires 2FA enabled)
spring.mail.password=

# Guard: prevents Spring Mail autoconfiguration from throwing when credentials are empty
spring.mail.test-connection=false

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

notification.email.from=
notification.email.from-name=TalentGrid Dev

# ─────────────────────────────────────────────────────────────────────────────
# Logging — FIX: Set notification and email channels to INFO explicitly.
# Without this, the log output depends on the root logger level, which in
# some Spring Boot setups defaults to WARN in production profiles.
# ─────────────────────────────────────────────────────────────────────────────
logging.level.com.talentgrid.notification=INFO
logging.level.com.talentgrid.kafka=INFO
logging.level.org.springframework.mail=DEBUG

# ─────────────────────────────────────────────────────────────────────────────
# Actuator (K8s health probes)
# ─────────────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always